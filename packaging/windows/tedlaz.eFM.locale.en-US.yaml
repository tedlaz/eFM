ShortDescription: A minimal desktop player for internet radio streams.
Description: |-
  A minimal desktop player for internet radio streams, written in Rust. Enter an
  Icecast or Shoutcast address (MP3/AAC/OGG/FLAC) and it plays, shows the ICY
  metadata the station sends, resumes the last stream on startup and reconnects
  on its own if the connection drops.
