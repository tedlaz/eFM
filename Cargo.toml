[package]
name = "efm"
version = "0.5.0"
edition = "2024"

# The package stays lowercase (that is what crates.io wants), but the executable
# takes the proper name of the app.
[[bin]]
name = "eFM"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
# Windows loads Segoe UI at runtime instead (see the target section below), so
# the bundled fonts are off by default and switched back on for other targets.
egui = { version = "0.36.1", default-features = false }
# No eframe: it only paints through a GPU, and the OpenGL driver alone mapped
# some 130MB into this process (DX12 through wgpu was measured worse still).
# The window is winit's, egui-winit feeds it to egui, and the pixels are painted
# on the CPU and handed to the window with softbuffer — see `main::Runner`.
egui-winit = { version = "0.36.1", default-features = false, features = [
    "clipboard",
    "wayland",
    "x11",
] }
egui_software_backend = { path = "vendor/egui_software_backend" }
# Not new: egui-winit builds it. It turns softbuffer's u32 pixels into the
# bytes the renderer writes.
bytemuck = "1.25"
softbuffer = "0.4"
winit = { version = "0.30.13", default-features = false, features = [
    "rwh_06",
    "wayland",
    "wayland-dlopen",
    "x11",
] }
icy-metadata = { version = "0.6.0", features = ["reqwest"] }
# The file dialog for exporting/importing the list. On Windows it is the native
# dialog; on Linux the default features give us the xdg-portal one.
rfd = "0.17.2"
# Only the codecs the README promises, without audio recording.
rodio = { version = "0.22.2", default-features = false, features = [
    "playback",
    "mp3",
    "mp4",
    "flac",
    "vorbis",
    "dither",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The defaults turn on `reqwest/default-tls`, which in reqwest 0.13 means rustls —
# and a second TLS stack got built next to the native-tls of Windows.
stream-download = { version = "0.24.3", default-features = false, features = [
    "reqwest-native-tls",
] }
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    # The search opens its own current-thread runtime, which needs the IO driver.
    "net",
] }

# Windows reads Segoe UI off the disk (see `theme::system_fonts`), so it is the
# one target that does not carry egui's 1.4MB of bundled fonts.
[target.'cfg(not(windows))'.dependencies]
egui = { version = "0.36.1", features = ["default_fonts"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.24"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
